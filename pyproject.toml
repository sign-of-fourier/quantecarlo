[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantecarlo"
version = "0.6.1"
description = "Batch Bayesian optimization (q-EI) backed by a remote GP service — standalone or as an Optuna BatchSampler suggest_fn"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
optuna = ["optuna>=3.0", "optunahub"]

[project.urls]
Homepage = "https://quantecarlo.com"

[tool.setuptools.packages.find]
include = ["quantecarlo*"]
